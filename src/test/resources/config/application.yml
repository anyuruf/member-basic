spring:
  application:
    name: genie_member
  # Replace by 'prod, faker' to add the faker context and have sample data loaded in production
  liquibase:
    contexts: test
 
  task:
    execution:
      thread-name-prefix: genie-member-task-
      pool:
        core-size: 1
        max-size: 50
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: genie-member-scheduling-
      pool:
        size: 20

server:
  port: 10344
  address: localhost

